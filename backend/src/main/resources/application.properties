spring.application.name=backend

# --- Configuración del Servidor ---
server.port=8080

spring.config.import=optional:file:../.env[.properties]

# --- Configuración de MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3307/mydatabase?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Carga las colecciones lazy (reseñas de toda la página)
# con un IN (...) en vez de una consulta por evento
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- JWT ---
jwt.secret=${JWT_SECRET}